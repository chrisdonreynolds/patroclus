name: Daily Patroclus Kalshi Longshot Underwriting Scanner

on:
  schedule:
    # 7:15 PM EST (UTC-5) = 00:15 UTC the next day
    # Runs 45 minutes before the 8:00 PM EST Gemini Risk Audit to absorb GitHub runner queue delays
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-patroclus-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Patroclus Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Patroclus Kalshi Quantitative Scanner v3.0
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner.py

      - name: Commit and Push Snapshot Files to https://github.com/chrisdonreynolds/patroclus
        run: |
          git config --global user.name "Christopher Don Reynolds (Patroclus Bot)"
          git config --global user.email "christopherdonreynolds@gmail.com"
          git add kalshi_snapshot.json kalshi_snapshot.md
          if git diff --staged --quiet; then
            echo "No snapshot changes detected."
          else
            git commit -m "chore(snapshot): automated daily Kalshi longshot underwriting scan v3.0 [skip ci]"
            git pull --rebase origin main
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/chrisdonreynolds/patroclus.git main
          fi

